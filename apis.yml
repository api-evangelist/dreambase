aid: dreambase
name: Dreambase
description: Dreambase is an AI-native analytics platform for Supabase. AI data agents connect to
  a Supabase project in one click via Supabase Auth, automatically detect the schema, and produce
  live dashboards, automated reports, and business insights without a separate data warehouse or a
  dedicated data team. An Analyst Agent builds and configures dashboards, ad-hoc reports enrich
  Supabase data with external sources, and Supabase Health Assessments scan projects for security,
  performance, and reliability issues with recommended fixes. Data sources beyond Postgres flow in
  through a plugin marketplace of MCP tools and REST APIs unified into cached datasets. Founded in
  2024 and backed by a seed round led by Felicis with participation from Supabase executives.
